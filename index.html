<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1424" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Leggende di Valmora</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="loading">
      <div class="logo"><span>Leggende di</span><b>VALMORA</b></div>
      <div class="bar"><i id="load-bar"></i></div>
      <p id="load-text">Preparo il mondo…</p>
    </div>

    <div id="hud" hidden>
      <div id="place"><b id="region-name">Valle Aurora</b><span id="clock">09:30</span></div>
      <canvas id="minimap" width="150" height="150"></canvas>
      <div id="team-strip"></div>
      <div id="hint" hidden></div>
      <div id="toast" hidden></div>
      <div id="banner" hidden><small id="banner-sub"></small><b id="banner-title"></b></div>
    </div>

    <div id="touch" hidden>
      <div id="joy-base"><div id="joy-knob"></div></div>
      <button id="btn-a" aria-label="Azione">A</button>
      <button id="btn-jump" aria-label="Salta">⤒</button>
      <button id="btn-run" aria-label="Corri">Corri</button>
      <button id="btn-menu" aria-label="Squadra">☰</button>
      <button id="btn-map" aria-label="Mappa">🗺</button>
    </div>

    <div id="dialog" hidden><div id="dialog-name"></div><div id="dialog-text"></div><div id="dialog-next">▼</div></div>
    <div id="choice" hidden><div id="choice-title"></div><div id="choice-list"></div></div>

    <div id="menu" class="panel" hidden>
      <header><h2>Squadra</h2><button class="close" data-close>✕</button></header>
      <div id="menu-party"></div>
      <footer id="menu-foot"></footer>
    </div>

    <div id="bigmap" class="panel" hidden>
      <header><h2>Mappa di Valmora</h2><button class="close" data-close>✕</button></header>
      <canvas id="bigmap-canvas" width="600" height="600"></canvas>
    </div>

    <div id="battle-ui" hidden>
      <div class="card foe"><div class="row"><b class="name"></b><span class="lv"></span></div><div class="types"></div><div class="hp"><i></i></div></div>
      <div class="card ally"><div class="row"><b class="name"></b><span class="lv"></span></div><div class="types"></div><div class="hp"><i></i></div><div class="hptext"></div><div class="xp"><i></i></div></div>
      <div id="battle-msg"></div>
      <div id="battle-actions" hidden>
        <button data-act="fight">Lotta</button>
        <button data-act="catch">Sfera <small id="ball-count"></small></button>
        <button data-act="team">Squadra</button>
        <button data-act="run">Fuga</button>
      </div>
      <div id="battle-moves" hidden></div>
      <div id="battle-team" hidden></div>
    </div>

    <div id="flash"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
